name: CI Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: ci-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit
    with:
      vercel-production: false
      api-url: ${{ vars.REACT_APP_API_URL_STAGING || vars.REACT_APP_API_URL || 'http://localhost:8000' }}
