name: CI

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: parallel checks (2 branches) ─────────────────────────────
  backend-test:
    name: 1 · Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -v

  frontend-quality:
    name: 1 · Frontend unit & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:ci
      - name: Lint
        run: npm run lint

  # ── Stage 2: build (after frontend quality) ───────────────────────────
  frontend-build:
    name: 2 · Frontend build
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          REACT_APP_API_URL: ${{ github.ref_name == 'main' && (secrets.REACT_APP_API_URL_PRODUCTION || vars.REACT_APP_API_URL_PRODUCTION) || (secrets.REACT_APP_API_URL_STAGING || vars.REACT_APP_API_URL_STAGING) || secrets.REACT_APP_API_URL || vars.REACT_APP_API_URL || 'http://localhost:8000' }}
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: frontend/build
          retention-days: 1

  # ── Stage 3: E2E (backend + build must pass) ─────────────────────────
  e2e:
    name: 3 · E2E tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: frontend/build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install Playwright
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npm run test:ci
        env:
          CI: true

  # ── Stage 4: deploy (optional) ──────────────────────────────────────
  deploy-vercel:
    name: 4 · Deploy Vercel
    runs-on: ubuntu-latest
    needs: [e2e]
    if: ${{ vars.ENABLE_VERCEL_DEPLOY != 'false' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REACT_APP_API_URL: ${{ github.ref_name == 'main' && (secrets.REACT_APP_API_URL_PRODUCTION || vars.REACT_APP_API_URL_PRODUCTION) || (secrets.REACT_APP_API_URL_STAGING || vars.REACT_APP_API_URL_STAGING) || secrets.REACT_APP_API_URL || vars.REACT_APP_API_URL || '' }}
        run: |
          npm install -g vercel@latest
          ENV_NAME="preview"
          PROD_FLAG=""
          if [ "${{ github.ref_name }}" = "main" ]; then
            ENV_NAME="production"
            PROD_FLAG="--prod"
          fi
          vercel pull --yes --environment="$ENV_NAME" --token="${{ secrets.VERCEL_TOKEN }}"
          VERCEL_ENV_FILE=".vercel/.env.${ENV_NAME}.local"
          if [ -f "$VERCEL_ENV_FILE" ]; then
            VERCEL_API_URL=$(grep -E '^REACT_APP_API_URL=' "$VERCEL_ENV_FILE" | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
            if [ -n "$VERCEL_API_URL" ] && { [ -z "$REACT_APP_API_URL" ] || [ "$REACT_APP_API_URL" = "http://localhost:8000" ]; }; then
              REACT_APP_API_URL="$VERCEL_API_URL"
              export REACT_APP_API_URL
            fi
          fi
          npm ci
          if [ -z "$REACT_APP_API_URL" ] || [ "$REACT_APP_API_URL" = "http://localhost:8000" ]; then
            echo "::error::REACT_APP_API_URL is missing. Set GitHub Secrets (or Variables): REACT_APP_API_URL_STAGING and REACT_APP_API_URL_PRODUCTION = https://vectorshift-assessment-j2i4.onrender.com (no trailing slash). Vercel Sensitive env vars are not exported by vercel pull — use GitHub Secrets for CI builds."
            exit 1
          fi
          echo "Building frontend with REACT_APP_API_URL=$REACT_APP_API_URL"
          npm run build
          mkdir -p .vercel/output/static
          cp -r build/. .vercel/output/static/
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          vercel deploy --prebuilt --yes --token="${{ secrets.VERCEL_TOKEN }}" $PROD_FLAG

  # ── Stage 5: gate (single dependency = clean graph) ─────────────────
  ci-success:
    name: 5 · All checks passed
    runs-on: ubuntu-latest
    needs: [deploy-vercel, e2e]
    if: always()
    steps:
      - name: Pipeline gate
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::E2E did not pass (${{ needs.e2e.result }}). Upstream tests or build failed."
            exit 1
          fi
          if [ "${{ needs.deploy-vercel.result }}" == "failure" ]; then
            echo "::error::Vercel deploy failed."
            exit 1
          fi
          if [ "${{ needs.deploy-vercel.result }}" == "success" ]; then
            echo "All checks passed — deployed to Vercel."
          else
            echo "All checks passed — deploy skipped (ENABLE_VERCEL_DEPLOY=false or no secrets)."
          fi
